<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MortgagePro — Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback: save current path and redirect to root
    // The index.html will read this and restore the URL via history.replaceState
    sessionStorage.redirect = location.pathname + location.search + location.hash;
    location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting to <a href="/">MortgagePro</a>...</p>
</body>
</html>
